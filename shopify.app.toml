# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "storeping_shopify_api_key"
name = "StorePing"
handle = "storeping"
application_url = "https://storeping.everonlab.in"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
# Critical scopes for Orders, Checkouts, Customers, Fulfillments, Discounts, and Products
scopes = "read_orders,write_orders,read_checkouts,write_checkouts,read_customers,read_fulfillments,write_fulfillments,read_discounts,write_discounts,read_products"

[auth]
redirect_urls = [
  "https://storeping.everonlab.in/auth/callback",
  "https://storeping.everonlab.in/auth/shopify/callback",
  "https://storeping.everonlab.in/api/auth/callback"
]


[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/cancelled", "orders/fulfilled", "fulfillments/create", "fulfillments/update", "checkouts/create", "checkouts/update", "customers/create"]
  uri = "/webhooks"

[pos]
embedded = false

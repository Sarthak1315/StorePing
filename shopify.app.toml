# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "41d2866a571078941a8565955ca0297d"
name = "StorePing"
handle = "storeping"
application_url = "https://storeping.everonlab.in"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_checkouts,read_customers,read_discounts,read_fulfillments,read_orders,read_products,write_checkouts,write_discounts,write_fulfillments,write_orders"

[auth]
redirect_urls = [
  "https://storeping.everonlab.in/auth/callback",
  "https://storeping.everonlab.in/auth/shopify/callback",
  "https://storeping.everonlab.in/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://storeping.everonlab.in/webhooks/privacy"
  customer_deletion_url = "https://storeping.everonlab.in/webhooks/privacy"
  shop_deletion_url = "https://storeping.everonlab.in/webhooks/privacy"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/fulfilled", "fulfillments/create", "fulfillments/update", "checkouts/create", "checkouts/update"]
  uri = "/webhooks"

[pos]
embedded = false
